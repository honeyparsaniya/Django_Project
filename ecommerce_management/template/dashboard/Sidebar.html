{% load static %}

<aside class="admin-sidebar" id="adminSidebar" aria-label="Main navigation">

    <!-- Sidebar Header -->
    <div class="sidebar-header">
        <a class="brand-mark" href="{% url 'dashboard' %}" aria-label="Admin Dashboard">

            <span class="brand-icon">
                <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
            </span>

            <span class="brand-copy">
                <span class="brand-title">adminHMD</span>
                <span class="brand-subtitle">Admin Template</span>
            </span>

        </a>
    </div>


    <!-- Sidebar Navigation -->
    <nav class="sidebar-nav">

        <!-- Dashboard -->
        <a class="nav-link" href="{% url 'dashboard' %}">
            <span class="nav-icon">
                <i class="bi bi-speedometer2" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Dashboard</span>
        </a>


        <!-- Users -->
        <a class="nav-link" href="{% url 'users' %}">
            <span class="nav-icon">
                <i class="bi bi-people" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Users</span>
        </a>


        <!-- Add User -->
        <a class="nav-link" href="{% url 'add_user' %}">
            <span class="nav-icon">
                <i class="bi bi-person-plus" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Add User</span>
        </a>


        <!-- Profile -->
        <a class="nav-link" href="{% url 'profile' %}">
            <span class="nav-icon">
                <i class="bi bi-person-badge" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Profile</span>
        </a>

        <a class="nav-link" href="{% url 'charts' %}">
            <span class="nav-icon">
                <i class="bi bi-bar-chart-line" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Charts</span>
        </a>


        <!-- Tables -->
        <a class="nav-link" href="{% url 'tables' %}">
            <span class="nav-icon">
                <i class="bi bi-table" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Tables</span>
        </a>


        <!-- Forms -->
        <a class="nav-link" href="{% url 'forms' %}">
            <span class="nav-icon">
                <i class="bi bi-ui-checks-grid" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Forms</span>
        </a>


        <!-- Components -->
        <a class="nav-link" href="{% url 'components' %}">
            <span class="nav-icon">
                <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Components</span>
        </a>


        <!-- Alerts -->
        <a class="nav-link" href="{% url 'alerts' %}">
            <span class="nav-icon">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Alerts</span>
        </a>


        <!-- Modals -->
        <a class="nav-link" href="{% url 'modals' %}">
            <span class="nav-icon">
                <i class="bi bi-window-stack" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Modals</span>
        </a>


        <!-- Settings -->
        <a class="nav-link" href="{% url 'settings' %}">
            <span class="nav-icon">
                <i class="bi bi-gear" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Settings</span>
        </a>


        <!-- Blank Page -->
        <a class="nav-link" href="{% url 'blank' %}">
            <span class="nav-icon">
                <i class="bi bi-file-earmark" aria-hidden="true"></i>
            </span>
            <span class="nav-text">Blank Page</span>
        </a>

    </nav>


    <!-- Sidebar User -->
    <div class="sidebar-user">

        <img
            class="avatar-img avatar-md sidebar-user-avatar"
            src="{% static 'Dashboard/assets/images/avatar/avatar.jpg' %}"
            alt="Admin Hasan"
        >

        <strong>Admin Hasan</strong>
        <small>Active Workspace</small>

    </div>


    <!-- Sidebar Footer -->
    <div class="sidebar-footer">

        <span class="status-dot"></span>

        <span class="sidebar-footer-text">
            System running smoothly
        </span>
