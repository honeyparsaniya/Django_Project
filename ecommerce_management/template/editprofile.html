{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-5 bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="bg-white rounded p-4 p-md-5 shadow-sm">

                    <div class="text-center mb-4">

                        <h2 class="text-primary">
                            Edit Profile
                        </h2>

                        <p class="text-muted">
                            Update your account information
                        </p>

                    </div>


                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <!-- Username -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Username
                            </label>

                            {{ form.username }}

                        </div>


                        <!-- Email -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Email
                            </label>

                            {{ form.email }}

                        </div>


                        <!-- Contact Number -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Contact Number
                            </label>

                            {{ form.contact_number }}

                        </div>


                        <!-- Role -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Account Type
                            </label>

                            {{ form.role }}

                        </div>


                        <!-- Terms -->

                        <div class="mb-4">

                            <div class="form-check">

                                {{ form.read_terms_and_conditions }}

                                <label class="form-check-label">
                                    I have read and agree to the
                                    Terms and Conditions.
                                </label>

                            </div>

                        </div>


                        <!-- Profile Image -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Profile Image
                            </label>

                            {{ form.image }}

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary rounded-pill px-4"
                            >
                                <i class="fas fa-save me-2"></i>
                                Save Changes
                            </button>

                            <a
                                href="{% url 'my_account' %}"
                                class="btn btn-secondary rounded-pill px-4"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
